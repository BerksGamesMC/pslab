<body class="bg-gray-900 text-white">

    <!-- PS4 Exploit On-Screen Debug Console -->
    <div id="ps4-exploit-debug-console">
        <div id="ps4-exploit-debug-header">
            <strong>PS4 Exploit Debug Konsol</strong>
            <button id="ps4-exploit-debug-clear" type="button"
                onclick="document.getElementById('ps4-exploit-debug-logs').innerHTML=''">Təmizlə</button>
        </div>
        <div id="ps4-exploit-debug-logs"></div>
    </div>

    <script>
        (function () {
            var logBox = document.getElementById('ps4-exploit-debug-logs');

            function writeLog(type, msg, color) {
                if (!logBox) return;
                var line = document.createElement('div');
                line.style.color = color || '#00ff66';
                line.style.borderBottom = '1px solid rgba(255,255,255,0.08)';
                line.style.padding = '2px 0';
                line.style.wordBreak = 'break-all';
                var now = new Date();
                var time = now.toTimeString().split(' ')[0];
                line.textContent = '[' + time + '] [' + type + '] ' + msg;
                logBox.appendChild(line);
                logBox.parentElement.scrollTop = logBox.parentElement.scrollHeight;
            }

            function formatArgs(args) {
                return Array.prototype.slice.call(args).map(function (a) {
                    if (typeof a === 'object' && a !== null) {
                        try { return JSON.stringify(a); } catch (e) { return String(a); }
                    }
                    return String(a);
                }).join(' ');
            }

            var origLog = console.log;
            var origWarn = console.warn;
            var origError = console.error;

            console.log = function () {
                writeLog('LOG', formatArgs(arguments), '#00ff66');
                if (origLog) origLog.apply(console, arguments);
            };

            console.warn = function () {
                writeLog('WARN', formatArgs(arguments), '#ffcc00');
                if (origWarn) origWarn.apply(console, arguments);
            };

            console.error = function () {
                writeLog('ERR', formatArgs(arguments), '#ff4444');
                if (origError) origError.apply(console, arguments);
            };

            window.addEventListener('error', function (e) {
                var target = e.target || e.srcElement;
                if (target && (target.tagName === 'IMG' || target.tagName === 'SCRIPT' || target.tagName === 'LINK')) {
                    writeLog('ASSET_ERR', target.tagName + ' yüklənmədi: ' + (target.src || target.href), '#ff6666');
                } else {
                    writeLog('JS_ERR', (e.message || 'Xəta') + ' (' + (e.filename || '') + ':' + (e.lineno || '') + ')', '#ff4444');
                }
            }, true);

            window.addEventListener('unhandledrejection', function (e) {
                writeLog('PROMISE_ERR', e.reason, '#ff4444');
            });

            writeLog('INFO', 'Exploit konsol aktivdir. UA: ' + navigator.userAgent, '#aaaaaa');
        })();
    </script>

    <script>
        function startExploitSafe() {
            try {

                } else if (typeof labFallbackStart === 'function') {

            } catch (e) {
                console.error('Exploit xətası:', e && e.stack ? e.stack : String(e));
            }
        }
